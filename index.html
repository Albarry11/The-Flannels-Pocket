      <h1>Selamat Datang di The Flannels Pocket, Studio Latihan Digital Band The Flannels</h1>
      <p>The Flannels Pocket adalah aplikasi web resmi band The Flannels untuk kebutuhan latihan, manajemen materi lagu, dan interaksi penonton. Aplikasi ini menggabungkan stems isolation, rehearsal DAW berbasis browser, audio analyzer, arsip lirik dan chord, serta leaderboard request lagu dalam satu tempat yang praktis. Aktifkan JavaScript pada browser Anda untuk menggunakan seluruh fitur interaktif aplikasi.</p>
      <h2>Fitur Utama</h2>
      <p>Stems isolation memungkinkan setiap personel berlatih bagian masing-masing: vokal dapat murnikan track vokal, drummer fokus pada stem drum, gitaris dan bassist menyeimbangkan stem instrumen tanpa mengganggu bagian lain. Rehearsal DAW menyediakan pemutar multi-track langsung di browser dengan kontrol quick kulik mute dan solo tanpa perlu memuat ulang audio, pengaturan kecepatan tempo, transposisi nada, volume master, dan metronom. Audio analyzer menampilkan informasi BPM dan tangga nada setiap lagu yang dikurasi langsung oleh band. Arsip lirik dan chord menjadi referensi cepat saat latihan. Leaderboard request lagu memungkinkan penonton mengajukan lagu favorit dan melihat peringkat request terpopuler secara real-time.</p>
      <h2>Tentang The Flannels</h2>
      <p>The Flannels adalah band beranggotakan empat orang dengan formasi vokal, drum, gitar, dan bass. Band ini menggunakan The Flannels Pocket sebagai alat bantu utama dalam persiapan setlist, latihan rutin, hingga koordinasi materi panggung. Aplikasi ini dirancang agar ringan diakses dari ponsel maupun komputer.</p>
      <h2>Cara Menggunakan</h2>
      <p>Buka halaman <a href="/#library">Library &amp; Antrian Lagu</a> untuk memilih lagu yang ingin dilatih, lanjutkan ke <a href="/#mixer">Mixer Console</a> untuk mengatur balance antar stem, atau kunjungi <a href="/#requests">Leaderboard Request Lagu</a> untuk mengajukan request. Lirik dan chord tersedia pada menu <a href="/#lyrics">Lirik &amp; Chord</a>. Seluruh proses audio berjalan lokal di browser Anda tanpa perangkat tambahan.</p>
